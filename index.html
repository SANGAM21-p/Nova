    // ==========================================
    // REUSABLE GROQ API CLIENT
    // ==========================================
    async function callGroqChatAPI({
      apiKey,
      model,
      messages,
      temperature = 0.7,
      maxTokens = 1024,
      signal,
      timeoutMs = 30000,
      stream = false,
      onStream = null
    }) {
      const startTime = performance.now();
      const timeoutCtrl = new AbortController();
      let timeoutId = null;

      if (timeoutMs > 0) {
        timeoutId = setTimeout(() => {
          timeoutCtrl.abort(new Error(`Timeout after ${Math.round(timeoutMs / 1000)}s`));
        }, timeoutMs);
      }

      let combinedSignal = timeoutCtrl.signal;
      if (signal) {
        if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.any === 'function') {
          try {
            combinedSignal = AbortSignal.any([signal, timeoutCtrl.signal]);
          } catch (e) {
            signal.addEventListener('abort', () => timeoutCtrl.abort(signal.reason || 'aborted'));
            combinedSignal = timeoutCtrl.signal;
          }
        } else {
          signal.addEventListener('abort', () => timeoutCtrl.abort(signal.reason || 'aborted'));
          combinedSignal = timeoutCtrl.signal;
        }
      }

      try {
        const useStreaming = Boolean(stream && onStream);
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey.trim()}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: model,
            messages: messages,
            temperature: parseFloat(temperature),
            max_tokens: parseInt(maxTokens),
            stream: useStreaming
          }),
          signal: combinedSignal
        });

        if (timeoutId) clearTimeout(timeoutId);
        const elapsed = Math.round(performance.now() - startTime);

        if (res.ok) {
          // SSE STREAMING HANDLING
          if (useStreaming && res.body) {
            const reader = res.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let accumulatedContent = '';
            let accumulatedReasoning = '';
            let buffer = '';

            try {
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop(); // keep partial chunk

                for (const line of lines) {
                  const trimmed = line.trim();
                  if (!trimmed || trimmed.startsWith(':')) continue;
                  if (trimmed === 'data: [DONE]') break;
                  if (trimmed.startsWith('data: ')) {
                    try {
                      const json = JSON.parse(trimmed.slice(6));
                      const delta = json?.choices?.[0]?.delta;
                      if (delta) {
                        if (delta.content) accumulatedContent += delta.content;
                        if (delta.reasoning) accumulatedReasoning += delta.reasoning;
                        onStream({
                          content: accumulatedContent,
                          reasoning: accumulatedReasoning || null,
                          is_streaming: true
                        });
                      }
                    } catch (e) {}
                  }
                }
              }
            } catch (streamErr) {
              if (streamErr.name === 'AbortError' || combinedSignal.aborted) {
                return { ok: false, status: 0, error: 'Request was cancelled by user.', is_aborted: true, latency_ms: Math.round(performance.now() - startTime), is_live: true };
              }
              throw streamErr;
            }

            let finalContent = accumulatedContent;
            let finalReasoning = accumulatedReasoning || null;

            if (!finalReasoning && finalContent.includes('<think>')) {
              const thinkMatch = finalContent.match(/<think>([\s\S]*?)<\/think>/);
              if (thinkMatch) {
                finalReasoning = thinkMatch[1].trim();
                finalContent = finalContent.replace(/<think>[\s\S]*?<\/think>/, '').trim();
              }
            }

            const totalTokens = finalContent.split(/\s+/).filter(Boolean).length;
            const finalElapsed = Math.round(performance.now() - startTime);

            return {
              ok: true,
              status: 200,
              content: finalContent || 'Empty response received from model.',
              reasoning: finalReasoning,
              latency_ms: finalElapsed,
              usage: {
                prompt_tokens: 0,
                completion_tokens: totalTokens,
                total_tokens: totalTokens
              },
              tokens: totalTokens,
              is_live: true
            };
          }

          // REGULAR JSON HANDLING
          let data;
          try {
            data = await res.json();
          } catch (jsonErr) {
            return { ok: false, status: res.status, error: 'Malformed JSON response from Groq API.', latency_ms: elapsed, is_live: true };
          }

          const choice = data?.choices?.[0];
          const choiceMsg = choice?.message || {};
          let content = choiceMsg.content || '';
          let reasoning = choiceMsg.reasoning || null;

          if (!reasoning && content.includes('<think>')) {
            const thinkMatch = content.match(/<think>([\s\S]*?)<\/think>/);
            if (thinkMatch) {
              reasoning = thinkMatch[1].trim();
              content = content.replace(/<think>[\s\S]*?<\/think>/, '').trim();
            }
          }

          if (!content && reasoning) {
            content = reasoning;
            reasoning = null;
          }

          const usage = data?.usage || {};
          const totalTokens = usage.total_tokens || content.split(/\s+/).filter(Boolean).length;

          return {
            ok: true,
            status: res.status,
            content: content || 'Empty response received from model.',
            reasoning: reasoning,
            latency_ms: elapsed,
            usage: {
              prompt_tokens: usage.prompt_tokens || 0,
              completion_tokens: usage.completion_tokens || 0,
              total_tokens: totalTokens
            },
            tokens: totalTokens,
            is_live: true
          };
        } else {
          let errorMsg = `HTTP Error ${res.status}`;
          try {
            const errData = await res.json();
            errorMsg = errData?.error?.message || errData?.message || errorMsg;
          } catch (e) {
            try {
              const text = await res.text();
              if (text) errorMsg = `${errorMsg}: ${text.substring(0, 150)}`;
            } catch (ignore) {}
          }

          let advice = '';
          if (res.status === 401) advice = ' (Unauthorized: Check key in Settings).';
          else if (res.status === 429) advice = ' (Rate limit exceeded. Please wait a moment).';

          return { ok: false, status: res.status, error: errorMsg + advice, latency_ms: elapsed, is_live: false };
        }
      } catch (err) {
        if (timeoutId) clearTimeout(timeoutId);
        const elapsed = Math.round(performance.now() - startTime);
        if (err.name === 'AbortError' || combinedSignal.aborted) {
          return { ok: false, status: 0, error: 'Request was cancelled by user.', is_aborted: true, latency_ms: elapsed, is_live: false };
        }
        return { ok: false, status: 0, error: `Connection failed: ${err.message || 'Check network'}`, latency_ms: elapsed, is_live: false };
      }
    }

    async function fetchGroqLiveModels({ apiKey, signal, timeoutMs = 15000 }) {
      const startTime = performance.now();
      const ctrl = new AbortController();
      let timeoutId = null;
      if (timeoutMs > 0) timeoutId = setTimeout(() => ctrl.abort(), timeoutMs);
      let combined = ctrl.signal;
      if (signal) {
        if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.any === 'function') {
          try {
            combined = AbortSignal.any([signal, ctrl.signal]);
          } catch (e) {
            signal.addEventListener('abort', () => ctrl.abort(signal.reason || 'aborted'));
            combined = ctrl.signal;
          }
        } else {
          signal.addEventListener('abort', () => ctrl.abort(signal.reason || 'aborted'));
          combined = ctrl.signal;
        }
      }

      try {
        const res = await fetch('https://api.groq.com/openai/v1/models', {
          headers: { 'Authorization': `Bearer ${apiKey.trim()}` },
          signal: combined
        });
        if (timeoutId) clearTimeout(timeoutId);
        const elapsed = Math.round(performance.now() - startTime);

        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data?.data)) {
            const textModels = data.data.filter(m => 
              m.id && !m.id.includes('whisper') && !m.id.includes('prompt-guard') &&
              (!m.output_modalities || m.output_modalities.includes('text')) &&
              !m.id.includes('preview') && !m.deprecated && m.active !== false
            );
            const formatted = textModels.map(m => {
              const parts = m.id.split('/');
              const rawName = parts[parts.length - 1];
              const cleanName = (m.name || rawName).replace(/[-_]/g, ' ');
              const provider = m.owned_by || (parts.length > 1 ? parts[0] : 'Groq');
              const isCoding = m.id.includes('code') || m.id.includes('qwen');
              const isReasoning = m.id.includes('r1') || m.id.includes('reason');
              const ctx = m.context_window || 131072;
              return {
                id: m.id,
                name: cleanName,
                provider: provider.charAt(0).toUpperCase() + provider.slice(1),
                description: `Live Groq LPU model (${Math.round(ctx / 1024)}k context limit).`,
                category: isCoding ? 'Coding' : (isReasoning ? 'Reasoning' : 'General Purpose'),
                capabilities: isCoding ? ['Coding', 'Fast'] : (isReasoning ? ['Reasoning', 'Math'] : ['General', 'Fast']),
                context_window: ctx,
                badge: 'Live Groq',
                speed_rating: 'Ultra Fast',
                is_live: true
              };
            });
            return { ok: true, models: formatted, latency_ms: elapsed };
          }
        }
        return { ok: false, error: `HTTP ${res.status}`, latency_ms: elapsed };
      } catch (err) {
        if (timeoutId) clearTimeout(timeoutId);
        return { ok: false, error: err.message, latency_ms: Math.round(performance.now() - startTime) };
      }
    }

    async function transcribeGroqAudio({ apiKey, audioBlob, language, signal, timeoutMs = 25000 }) {

      const ctrl = new AbortController();
      let timeoutId = null;
      if (timeoutMs > 0) timeoutId = setTimeout(() => ctrl.abort(), timeoutMs);

      try {
        const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey.trim()}`
          },
          body: formData,
          signal: ctrl.signal
        });

        if (res.ok) {
          const data = await res.json();
          return { ok: true, text: data?.text || '' };

      }
    }

    function MarkdownRenderer({ content = '', reasoning = null, isLive = false, isError = false }) {
      const segments = useMemo(() => {
        if (!content) return [];
        const pattern = new RegExp("```([a-zA-Z0-9_\\-\\+]*)(\\n)([\\s\\S]*?)(?:```|$)", "g");
        const result = [];
        let lastIdx = 0;
        let match;

        while ((match = pattern.exec(content)) !== null) {
          if (match.index > lastIdx) {
            result.push({ type: 'markdown', text: content.substring(lastIdx, match.index) });
          }
          result.push({
            type: 'code',
            language: match[1] || 'plaintext',
            code: match[3].replace(new RegExp('\\n$', ''), '')
          });
          lastIdx = pattern.lastIndex;
        }

        if (lastIdx < content.length) {
          result.push({ type: 'markdown', text: content.substring(lastIdx) });
        }
        return result;
      }, [content]);

      const parseMarkdownSafe = (text) => {
        if (typeof marked !== 'undefined' && marked.parse) {
          try { return { __html: marked.parse(text) }; } catch (e) {}
        }
        let html = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.*?)\*/g, '<em>$1</em>')
          .replace(/`([^`]+)`/g, '<code class="px-1 py-0.5 rounded bg-slate-800 text-purple-300 font-mono text-[11px] border border-slate-700">$1</code>');
        return { __html: html.split('\n\n').map(p => p.trim() ? `<p class="my-1.5">${p.replace(/\n/g, '<br/>')}</p>` : '').join('') };
      };

      if (isError) {
        return (
          <div className="p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs flex items-start gap-2">
            <Icons.AlertTriangle className="w-4 h-4 text-rose-400 shrink-0 mt-0.5" />
            <div className="whitespace-pre-wrap">{content}</div>
          </div>
        );
      }

      return (
        <div className="space-y-1 leading-relaxed">
          {reasoning && <ReasoningBlock reasoning={reasoning} isLive={isLive} />}
          {segments.map((seg, idx) => {
            if (seg.type === 'code') {
              return <CodeBlock key={idx} language={seg.language} code={seg.code} />;
            }
            return (
              <div
                key={idx}
                className="prose-minimal text-xs sm:text-sm text-slate-800 dark:text-slate-200"
                dangerouslySetInnerHTML={parseMarkdownSafe(seg.text)}
              />
            );
          })}
        </div>
      );
    }

        e.preventDefault();
        if (!newTitle.trim() || !newSystemPrompt.trim()) {
          if (addToast) addToast('Title and System Persona prompt are required', 'error');
          return;

          id: 'custom-' + Date.now(),
          title: newTitle.trim(),
          category: newCategory,
          recommendedModel: newModel,
          systemPrompt: newSystemPrompt.trim(),
          prompt: newPrompt.trim() || 'Please introduce yourself and explain how you can help me.',
          isCustom: true

        setNewTitle('');
        setNewSystemPrompt('');
        setNewPrompt('');

        e.stopPropagation();

    // ==========================================
    function PlaygroundView({
      models,
      currentModelId,
      setCurrentModelId,
      prefillPrompt,
      clearPrefillPrompt,
      sessionApiKey,
      setSessionApiKey,
      isLiveApi,
      conversations,
      setConversations,
      activeConversationId,
      setActiveConversationId,
      onOpenSettings,
      recordTelemetry,
      addToast,
      requestTimeout,
      userName,
      onOpenTemplates
    }) {
      const activeConvo = conversations.find(c => c.id === activeConversationId);
      
      // Messages state: empty by default for fresh session to trigger Greeting Screen
      const [messages, setMessages] = useState(() => {
        if (activeConvo && activeConvo.messages && activeConvo.messages.length > 0) {
          return activeConvo.messages;
        }
        return [];
      });

      const [inputPrompt, setInputPrompt] = useState(prefillPrompt || '');
      const [systemPrompt, setSystemPrompt] = useState(activeConvo?.system_prompt || TEMPLATES[0].systemPrompt);
      const [showParams, setShowParams] = useState(false);
      const [showSystemDrawer, setShowSystemDrawer] = useState(false);
      const [temperature, setTemperature] = useState(0.7);
      const [maxTokens, setMaxTokens] = useState(1024);
      const [isLoading, setIsLoading] = useState(false);
      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [copiedIdx, setCopiedIdx] = useState(null);
      const [showExportMenu, setShowExportMenu] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [isTranscribing, setIsTranscribing] = useState(false);
      const [recordingSeconds, setRecordingSeconds] = useState(0);
      const [audioLevel, setAudioLevel] = useState(0);

      const messagesEndRef = useRef(null);
      const abortCtrlRef = useRef(null);
      const timerRef = useRef(null);
      const textareaRef = useRef(null);
      const chatInputRef = useRef(null);
      const recognitionRef = useRef(null);
      const mediaStreamRef = useRef(null);
      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);
      const recTimerRef = useRef(null);
      const basePromptRef = useRef('');
      const transcriptRef = useRef('');
      const finalTranscriptRef = useRef('');
      const isListeningRef = useRef(false);
      const audioContextRef = useRef(null);
      const animFrameRef = useRef(null);
      const restartTimeoutRef = useRef(null);
      const activeTargetRef = useRef(null);

      // Unified text injector for textareas, inputs, and search fields
      const updateInputsWithText = (text) => {
        setInputPrompt(text);

        // Update greeting prompt textarea
        if (textareaRef.current) {
          textareaRef.current.value = text;
          textareaRef.current.scrollTop = textareaRef.current.scrollHeight;
        }

        // Update active chat input
        if (chatInputRef.current) {
          chatInputRef.current.value = text;
        }

        // If another input/search field was active when speaking, update it as well
        const target = activeTargetRef.current || document.activeElement;
        if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') && target !== textareaRef.current && target !== chatInputRef.current) {
          target.value = text;
          target.dispatchEvent(new Event('input', { bubbles: true }));
        }
      };

      const cleanupAudioStream = () => {
        if (animFrameRef.current) {
          cancelAnimationFrame(animFrameRef.current);
          animFrameRef.current = null;
        }
        if (audioContextRef.current) {
          try { audioContextRef.current.close(); } catch(e) {}
          audioContextRef.current = null;
        }
        if (mediaStreamRef.current) {
          mediaStreamRef.current.getTracks().forEach(t => t.stop());
          mediaStreamRef.current = null;
        }
        setAudioLevel(0);
      };

      const startAudioLevelMeter = (stream) => {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          const ctx = new AudioContextClass();
          audioContextRef.current = ctx;
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 64;
          analyser.smoothingTimeConstant = 0.5;
          const src = ctx.createMediaStreamSource(stream);
          src.connect(analyser);

          const dataArray = new Uint8Array(analyser.frequencyBinCount);
          const updateLevel = () => {
            if (!isListeningRef.current) {
              setAudioLevel(0);
              return;
            }
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            const avg = sum / dataArray.length;
            const normalized = Math.min(100, Math.round((avg / 110) * 100));
            setAudioLevel(normalized);
            animFrameRef.current = requestAnimationFrame(updateLevel);
          };
          updateLevel();
        } catch (e) {
          console.warn('AudioContext level meter init error:', e);
        }
      };

      // Stop Voice Recording & Finalize Text
      const stopVoiceInput = async () => {
        if (!isListeningRef.current) return;
        isListeningRef.current = false;
        setIsListening(false);

        if (restartTimeoutRef.current) {
          clearTimeout(restartTimeoutRef.current);
          restartTimeoutRef.current = null;
        }

        if (recTimerRef.current) {
          clearInterval(recTimerRef.current);
          recTimerRef.current = null;
        }

        // 1. Stop SpeechRecognition
        if (recognitionRef.current) {
          const rec = recognitionRef.current;
          recognitionRef.current = null;
          try { rec.stop(); } catch(e) {}
        }

        // 2. Stop MediaRecorder
        const mr = mediaRecorderRef.current;
        mediaRecorderRef.current = null;
        if (mr && mr.state !== 'inactive') {
          await new Promise(resolve => {
            mr.onstop = resolve;
            try { mr.stop(); } catch(e) { resolve(); }
          });
        }

        // 3. Stop Audio Streams & Visualizer
        cleanupAudioStream();

        // 4. Did Web Speech capture text in real-time?
        const capturedText = (transcriptRef.current || finalTranscriptRef.current || '').trim();
        if (capturedText) {
          const base = basePromptRef.current ? basePromptRef.current.trim() : '';
          const finalVal = base ? `${base} ${capturedText}` : capturedText;
          updateInputsWithText(finalVal);
          if (addToast) addToast(`Voice captured: "${capturedText.slice(0, 32)}${capturedText.length > 32 ? '...' : ''}"`, 'success');
          return;
        }

        // 5. Fallback: Transcribe audio blob via Whisper Turbo if collected by MediaRecorder
        const audioBlob = audioChunksRef.current.length > 0
          ? new Blob(audioChunksRef.current, { type: audioChunksRef.current[0]?.type || 'audio/webm' })
          : null;
        audioChunksRef.current = [];

        if (audioBlob && audioBlob.size > 2000) {
          const effectiveKey = sessionApiKey || getSessionApiKey();
          if (effectiveKey && effectiveKey.trim()) {
            setIsTranscribing(true);
            if (addToast) addToast('Transcribing audio via Whisper Turbo...', 'info');
            try {
              const res = await transcribeGroqAudio({ apiKey: effectiveKey.trim(), audioBlob });
              if (res.ok && res.text) {
                const transcribed = res.text.trim();
                const base = basePromptRef.current ? basePromptRef.current.trim() : '';
                const finalVal = base ? `${base} ${transcribed}` : transcribed;
                transcriptRef.current = transcribed;
                updateInputsWithText(finalVal);
                if (addToast) addToast(`Voice transcribed: "${transcribed.slice(0, 32)}${transcribed.length > 32 ? '...' : ''}"`, 'success');
              } else {
                if (addToast) addToast(`Whisper transcription: ${res.error || 'No speech detected'}`, 'error');
              }
            } catch (err) {
              if (addToast) addToast(`Audio transcription error: ${err.message}`, 'error');
            } finally {
              setIsTranscribing(false);
            }
          } else {
            if (addToast) addToast('Speech detected. Tip: Add Groq API Key in Settings for universal Whisper transcription fallback.', 'info');
          }
        } else {
          if (!capturedText) {
            if (addToast) addToast('No speech detected. Speak closer to the microphone.', 'info');
          }
        }
      };

      // Start Voice Input (Live Typing + Voice Level Detection + Parallel Whisper Fallback)
      const startVoiceInput = async () => {
        isListeningRef.current = true;
        setIsListening(true);
        setRecordingSeconds(0);
        basePromptRef.current = inputPrompt || '';
        transcriptRef.current = '';
        finalTranscriptRef.current = '';
        audioChunksRef.current = [];
        activeTargetRef.current = document.activeElement;

        // Focus the appropriate input box
        setTimeout(() => {
          if (textareaRef.current && (!activeTargetRef.current || activeTargetRef.current === document.body)) {
            textareaRef.current.focus();
          } else if (chatInputRef.current && (!activeTargetRef.current || activeTargetRef.current === document.body)) {
            chatInputRef.current.focus();
          }
        }, 50);

        // Start timer
        if (recTimerRef.current) clearInterval(recTimerRef.current);
        recTimerRef.current = setInterval(() => {
          setRecordingSeconds(s => {
            if (s >= 59) {
              stopVoiceInput();
              return 60;
            }
            return s + 1;
          });
        }, 1000);

        // Request microphone access for real-time visual meter and parallel Whisper audio fallback
        let stream = null;
        try {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            if (!isListeningRef.current) {
              stream.getTracks().forEach(t => t.stop());
              return;
            }
            mediaStreamRef.current = stream;

            // Start live audio visualizer
            startAudioLevelMeter(stream);

            // Start parallel background MediaRecorder for instant Whisper fallback if needed
            if (typeof MediaRecorder !== 'undefined') {
              let mimeType = '';
              if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mimeType = 'audio/webm;codecs=opus';
              else if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
              else if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';

              const mr = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
              mr.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) audioChunksRef.current.push(e.data);
              };
              mr.start(250);
              mediaRecorderRef.current = mr;
            }
          }
        } catch (micErr) {
          console.warn('Microphone stream error:', micErr);
          if (micErr.name === 'NotAllowedError') {
            if (addToast) addToast('Microphone permission denied. Allow mic access in browser settings.', 'error');
            stopVoiceInput();
            return;
          }
        }

        // Initialize Real-Time Web Speech Recognition Engine
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec) {
          const initRecognition = () => {
            if (!isListeningRef.current) return;
            try {
              if (recognitionRef.current) {
                try { recognitionRef.current.stop(); } catch(e) {}
                recognitionRef.current = null;
              }
              const rec = new SpeechRec();
              rec.continuous = true;
              rec.interimResults = true;
              rec.lang = navigator.language || 'en-US';
              rec.maxAlternatives = 1;

              rec.onresult = (ev) => {
                let interim = '';
                for (let i = ev.resultIndex; i < ev.results.length; i++) {
                  const res = ev.results[i];
                  const trans = res[0]?.transcript || '';
                  if (res.isFinal) {
                    finalTranscriptRef.current += (finalTranscriptRef.current ? ' ' : '') + trans.trim();
                  } else {
                    interim += trans;
                  }
                }
                const combined = (finalTranscriptRef.current + (interim ? (finalTranscriptRef.current ? ' ' : '') + interim : '')).trim();
                if (combined) {
                  transcriptRef.current = combined;
                  const base = basePromptRef.current ? basePromptRef.current.trim() : '';
                  const fullVal = base ? `${base} ${combined}` : combined;
                  updateInputsWithText(fullVal);
                }
              };

              rec.onerror = (ev) => {
                console.warn('SpeechRecognition error:', ev.error);
                if (ev.error === 'no-speech') return; // User simply paused
                if (ev.error === 'not-allowed') {
                  if (addToast) addToast('Microphone permission denied for Web Speech.', 'error');
                  stopVoiceInput();
                } else if (ev.error === 'network') {
                  console.info('Web Speech network offline/file protocol. MediaRecorder fallback is active.');
                }
              };

              rec.onend = () => {
                // Graceful restart on pause while active
                if (isListeningRef.current) {
                  restartTimeoutRef.current = setTimeout(() => {
                    if (isListeningRef.current) initRecognition();
                  }, 80);
                }
              };

              rec.start();
              recognitionRef.current = rec;
            } catch (srErr) {
              console.warn('SpeechRec start error:', srErr);
            }
          };

          initRecognition();
          if (addToast) addToast('Listening... Speak now and watch text type in real time', 'info');
        } else {
          if (addToast) addToast('Recording audio... Click Stop when finished to transcribe', 'info');
        }
      };

      const toggleVoiceInput = () => {
        if (isListening) {
          stopVoiceInput();
        } else {
          startVoiceInput();
        }
      };

      useEffect(() => {
        return () => {
          if (restartTimeoutRef.current) clearTimeout(restartTimeoutRef.current);
          if (recTimerRef.current) clearInterval(recTimerRef.current);
          if (recognitionRef.current) {
            try { recognitionRef.current.stop(); } catch(e) {}
          }
          cleanupAudioStream();
        };
      }, []);

      // Consume prefill prompt
      useEffect(() => {
        if (prefillPrompt) {
          setInputPrompt(prefillPrompt);
          clearPrefillPrompt();
          textareaRef.current?.focus();
        }
      }, [prefillPrompt]);

      // If active conversation changes, sync messages
      useEffect(() => {
        if (activeConvo && activeConvo.messages) {
          setMessages(activeConvo.messages);
          if (activeConvo.system_prompt) setSystemPrompt(activeConvo.system_prompt);
          if (activeConvo.model) setCurrentModelId(activeConvo.model);
        } else if (!activeConversationId) {
          // If activeConversationId is null, reset to fresh Greeting Screen
          setMessages([]);
          setInputPrompt('');
        }
      }, [activeConversationId]);

      // Scroll to bottom on new messages in chat screen
      useEffect(() => {
        if (messages.length > 0) {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
      }, [messages, isLoading]);

      // Timer effect
      useEffect(() => {
        if (isLoading) {
          setElapsedSeconds(0);
          timerRef.current = setInterval(() => {
            setElapsedSeconds(prev => +(prev + 0.1).toFixed(1));
          }, 100);
        } else {
          if (timerRef.current) clearInterval(timerRef.current);
        }
        return () => {
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [isLoading]);

      // Clean up abort controller on unmount
      useEffect(() => {
        return () => {
          if (abortCtrlRef.current) abortCtrlRef.current.abort();
        };
      }, []);

      const handleStopGeneration = () => {
        if (abortCtrlRef.current) {
          abortCtrlRef.current.abort();
          abortCtrlRef.current = null;
        }
        setIsLoading(false);
        addToast('Generation stopped', 'info');
      };

      const handleStartNewChat = () => {
        setActiveConversationId(null);
        setMessages([]);
        setInputPrompt('');
        addToast('Switched to clean greeting screen', 'info');
      };

      // Send prompt: switches screen to Active Chat View if in Greeting Screen
      const handleSend = async (e, overridePrompt = '') => {
        e?.preventDefault();
        const rawText = overridePrompt || inputPrompt;
        const promptValidation = validatePrompt(rawText);
        if (!promptValidation.valid || isLoading) return;

        const text = promptValidation.text;
        const newMsgList = [...messages, { role: 'user', content: text }];
        // THIS SWITCHES SCREEN TO ACTIVE CHAT
        setMessages(newMsgList);
        setInputPrompt('');
        setIsLoading(true);

        const ctrl = new AbortController();
        abortCtrlRef.current = ctrl;
        const effectiveKey = sessionApiKey.trim();

        if (effectiveKey) {
          const apiMessages = [
            { role: 'system', content: systemPrompt },
            ...newMsgList.map(m => ({ role: m.role, content: m.content }))
          ];

          // Initialize live streaming placeholder message
          const initialAssistant = {
            role: 'assistant',
            content: '',
            reasoning: null,
            tokens: 0,
            latency_ms: 0,
            is_live: true,
            is_streaming: true
          };
          setMessages([...newMsgList, initialAssistant]);

          const result = await callGroqChatAPI({
            apiKey: effectiveKey,
            model: currentModelId,
            messages: apiMessages,
            temperature: parseFloat(temperature),
            maxTokens: parseInt(maxTokens),
            signal: ctrl.signal,
            timeoutMs: (requestTimeout || 30) * 1000,
            stream: true,
            onStream: ({ content, reasoning }) => {
              setMessages(prev => {
                const next = [...prev];
                const lastIdx = next.length - 1;
                if (next[lastIdx] && next[lastIdx].role === 'assistant') {
                  next[lastIdx] = {
                    ...next[lastIdx],
                    content: content,
                    reasoning: reasoning,
                    tokens: content.split(/\s+/).filter(Boolean).length
                  };
                }
                return next;
              });
            }
          });

          recordTelemetry({
            endpoint: '/openai/v1/chat/completions',
            model: currentModelId,
            status: result.status,
            statusText: result.ok ? '200 OK (Stream)' : (result.is_aborted ? 'Aborted' : `Error ${result.status}`),
            latencyMs: result.latency_ms,
            promptTokens: result.usage?.prompt_tokens || 0,
            completionTokens: result.usage?.completion_tokens || 0,
            totalTokens: result.tokens || 0,
            isLive: result.is_live,
            isSimulated: false,
            error: result.ok ? null : result.error,
            promptPreview: text.substring(0, 100),
            responsePreview: (result.content || result.error || '').substring(0, 120)
          });

          if (result.ok) {
            const updated = [
              ...newMsgList,
              {
                role: 'assistant',
                content: result.content,
                reasoning: result.reasoning,
                tokens: result.tokens,
                latency_ms: result.latency_ms,
                is_live: true,
                is_simulated: false,
                is_streaming: false
              }
            ];
            setMessages(updated);
            saveConvo(updated, text);
          } else if (result.is_aborted) {
            const updated = [
              ...newMsgList,
              { role: 'assistant', content: '*(Inference cancelled by user)*', latency_ms: result.latency_ms, tokens: 0 }
            ];
            setMessages(updated);
          } else {
            const updated = [
              ...newMsgList,
              { role: 'assistant', content: result.error, latency_ms: result.latency_ms, tokens: 0, is_error: true }
            ];
            setMessages(updated);
            if (addToast) addToast(`API Error: ${result.error.substring(0, 50)}...`, 'error');
          }
        } else {
          // Demo typewriter streaming simulation
          const sim = simulateSpecializedResponse({ model: currentModelId, prompt: text });
          const words = sim.content.split(' ');
          let wordIdx = 0;
          const initialDemo = {
            role: 'assistant',
            content: '',
            reasoning: sim.reasoning,
            tokens: 0,
            latency_ms: sim.latency_ms,
            is_live: false,
            is_simulated: true,
            is_streaming: true
          };
          setMessages([...newMsgList, initialDemo]);

          const typeInterval = setInterval(() => {
            if (wordIdx < words.length && abortCtrlRef.current && !abortCtrlRef.current.signal.aborted) {
              wordIdx += 2;
              const curContent = words.slice(0, wordIdx).join(' ');
              setMessages(prev => {
                const next = [...prev];
                const lastIdx = next.length - 1;
                if (next[lastIdx] && next[lastIdx].role === 'assistant') {
                  next[lastIdx] = {
                    ...next[lastIdx],
                    content: curContent,
                    tokens: wordIdx
                  };
                }
                return next;
              });
            } else {
              clearInterval(typeInterval);
              if (abortCtrlRef.current && !abortCtrlRef.current.signal.aborted) {
                recordTelemetry({
                  endpoint: 'demo://chat',
                  model: currentModelId,
                  status: 200,
                  statusText: '200 Demo OK (Typewriter)',
                  latencyMs: sim.latency_ms,
                  promptTokens: 15,
                  completionTokens: sim.tokens,
                  totalTokens: sim.tokens,
                  isLive: false,
                  isSimulated: true,
                  error: null,
                  promptPreview: text.substring(0, 100),
                  responsePreview: sim.content.substring(0, 120)
                });
                const finalUpdated = [
                  ...newMsgList,
                  {
                    role: 'assistant',
                    content: sim.content,
                    reasoning: sim.reasoning,
                    tokens: sim.tokens,
                    latency_ms: sim.latency_ms,
                    is_live: false,
                    is_simulated: true,
                    is_streaming: false
                  }
                ];
                setMessages(finalUpdated);
                saveConvo(finalUpdated, text);
                setIsLoading(false);
              }
            }
          }, 28);
          return;
        }

        setIsLoading(false);
        abortCtrlRef.current = null;
      };

      const saveConvo = (msgs, lastText) => {
        const title = lastText.length > 36 ? lastText.substring(0, 36) + '...' : lastText;
        if (activeConversationId) {
          setConversations(prev => prev.map(c => c.id === activeConversationId ? { ...c, messages: msgs, model: currentModelId, updated_at: 'Just now' } : c));
        } else {
          const newId = 'conv-' + Date.now();
          setActiveConversationId(newId);
          setConversations(prev => [
            { id: newId, title: title || 'New Conversation', model: currentModelId, system_prompt: systemPrompt, updated_at: 'Just now', messages: msgs },
            ...prev
          ]);
        }
      };

      const handleClear = () => {
        if (!confirm('Clear conversation and return to greeting screen?')) return;
        handleStartNewChat();
      };

      const handleExport = (format) => {
        setShowExportMenu(false);
        const title = activeConvo?.title || `nova-${currentModelId}`;
        const cleanTitle = title.replace(/[^a-zA-Z0-9_-]/g, '_');

        if (format === 'pdf' || format === 'html') {
          const exportHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>${activeConvo?.title || 'Nova Conversation'}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #090d16; color: #f1f5f9; padding: 2.5rem; max-width: 820px; margin: 0 auto; line-height: 1.6; }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; font-weight: 800; color: #ffffff; }
    .meta { font-size: 0.8rem; color: #94a3b8; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid #1e293b; }
    .badge { display: inline-block; padding: 0.2rem 0.5rem; background: #8b5cf625; color: #c4b5fd; border-radius: 6px; font-weight: 700; font-size: 0.75rem; border: 1px solid #8b5cf640; }
    .system { background: #131b2e; border-left: 3px solid #8b5cf6; padding: 0.75rem 1rem; border-radius: 0 8px 8px 0; margin-bottom: 2rem; font-size: 0.85rem; color: #cbd5e1; }

    pre { background: #0b0f19; padding: 0.75rem; border-radius: 8px; overflow-x: auto; font-size: 0.8rem; font-family: monospace; border: 1px solid #1e293b; }

    @media print {
      body { background: #ffffff !important; color: #000000 !important; padding: 1rem !important; }
      h1 { color: #000000 !important; }
      .meta { border-color: #e2e8f0 !important; color: #64748b !important; }
      .badge { background: #f1f5f9 !important; color: #475569 !important; border-color: #cbd5e1 !important; }
      .system { background: #f8fafc !important; color: #334155 !important; border-left-color: #7c3aed !important; }
      .msg.user { background: #f1f5f9 !important; color: #000000 !important; border: 1px solid #cbd5e1 !important; }
      .msg.assistant { background: #ffffff !important; color: #000000 !important; border: 1px solid #e2e8f0 !important; }
      .reasoning { background: #f8fafc !important; color: #475569 !important; }
      pre { background: #f8fafc !important; color: #000000 !important; border: 1px solid #e2e8f0 !important; }
    }
  </style>
</head>
<body>
  <h1>${activeConvo?.title || 'Nova Conversation'}</h1>
  <div class="meta">
    <span class="badge">${currentModelId}</span> • Exported: ${new Date().toLocaleString()}
  </div>
  ${systemPrompt ? `<div class="system"><strong>System Persona:</strong> ${systemPrompt}</div>` : ''}
  ${messages.map(m => `
    <div class="msg ${m.role}">
      <div class="msg-header">
        <span>${m.role === 'user' ? 'User' : 'Assistant'}</span>
        <span>${m.tokens ? m.tokens + ' tokens' : ''} ${m.latency_ms ? '• ' + m.latency_ms + 'ms' : ''}</span>
      </div>
      ${m.reasoning ? `<div class="reasoning"><strong>Reasoning Trace:</strong><br/>${m.reasoning}</div>` : ''}
      <div>${m.content.replace(/\n/g, '<br/>')}</div>
    </div>
  `).join('')}
</body>

          if (format === 'pdf') {
            const printWin = window.open('', '_blank');
            if (printWin) {
              printWin.document.write(exportHtml);
              printWin.document.close();
              printWin.focus();
              setTimeout(() => { printWin.print(); }, 500);
              if (addToast) addToast('Opening Print / PDF dialog...', 'success');
              return;
            }
          }

          // HTML download
          const blob = new Blob([exportHtml], { type: 'text/html' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${cleanTitle}.html`;
          a.click();
          URL.revokeObjectURL(url);
          if (addToast) addToast('Exported standalone HTML snapshot', 'success');
          return;
        }

        const filename = `${cleanTitle}.${format === 'json' ? 'json' : 'md'}`;
        let fileContent = '';

        if (format === 'json') {
          fileContent = JSON.stringify({
            title: activeConvo?.title || 'Nova Conversation',
            model: currentModelId,
            system_prompt: systemPrompt,
            exported_at: new Date().toISOString(),
            messages: messages
          }, null, 2);
        } else {
          fileContent = `# ${activeConvo?.title || 'Nova Conversation'}\n\n` +
            `*Model: ${currentModelId} | Exported: ${new Date().toLocaleString()}*\n\n` +
            `> System Prompt: ${systemPrompt}\n\n---\n\n` +
            messages.map(m => `### ${m.role === 'user' ? 'User' : 'Assistant'} (${m.tokens || 0} tokens, ${m.latency_ms || 0}ms)\n\n${m.content}\n\n`).join('---\n\n');
        }

        const blob = new Blob([fileContent], { type: format === 'json' ? 'application/json' : 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        if (addToast) addToast(`Exported as ${format.toUpperCase()}`, 'success');

        if (hour < 18) return 'Good afternoon';

                    onChange={e => setMaxTokens(parseInt(e.target.value))}
                    className="w-full accent-purple-500 cursor-pointer"
                  />

            {/* Centered Hero Greeting */}
            <div className="text-center space-y-3 my-auto py-8">
              <div className="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-purple-500/20">
                <Icons.Sparkles className="w-6 h-6" />

              <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-800 dark:text-slate-100">
                {getGreetingTime()}, {userName || 'Developer'}

              {/* 4 Minimal Starter Suggestion Chips */}

            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={handleStartNewChat}
                className="px-3 py-1.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer shadow-xs"
                title="Start new conversation and return to greeting screen"
              >
                <Icons.Plus className="w-3.5 h-3.5" />
                <span>New Chat</span>
              </button>

              <button
                onClick={() => setShowParams(!showParams)}
                className={`p-1.5 rounded-xl border text-xs font-semibold cursor-pointer ${
                  showParams ? 'bg-purple-500/20 text-purple-300 border-purple-500' : 'bg-white dark:bg-slate-800 text-slate-400 border-slate-200 dark:border-slate-700'
                }`}
                title="Parameters"
              >
                <Icons.Sliders className="w-4 h-4" />
              </button>

              {/* Export */}
              <div className="relative">
                <button
                  onClick={() => setShowExportMenu(!showExportMenu)}
                  className="p-1.5 rounded-xl bg-white dark:bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-200 dark:border-slate-700 transition-colors cursor-pointer"
                  title="Export dialogue"

                  <Icons.Download className="w-4 h-4" />
                </button>
                {showExportMenu && (

                    <button onClick={() => handleExport('pdf')} className="w-full px-3 py-1.5 text-left hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2 text-purple-400 cursor-pointer">

          {/* Chat Messages Thread */}
          <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">

                      <Icons.RefreshCw className="w-4 h-4 animate-spin shrink-0" />
                      <span className="hidden sm:inline">Transcribing...</span>
                    </>
                  ) : (
                    <Icons.Mic className="w-4 h-4" />
                  )}
                </button>
              </div>

              {isLoading ? (
                <button
                  type="button"
                  onClick={handleStopGeneration}
                  className="h-11 px-4 rounded-xl bg-rose-600 text-white font-bold text-xs flex items-center gap-1 cursor-pointer shrink-0"
                >
                  <Icons.Square className="w-3.5 h-3.5" />
                  <span>Stop</span>
                </button>
              ) : (
                <button
                  type="submit"
                  disabled={!inputPrompt.trim() || isLoading}
                  className="h-11 px-4 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs flex items-center justify-center transition-all disabled:opacity-40 cursor-pointer shrink-0"
                >
                  <Icons.Send className="w-4 h-4" />
                </button>
              )}
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPARE SECTION (Minimalist Multi-Model Benchmark)
    // ==========================================
    function CompareSection({ models, sessionApiKey, fullView = false, recordTelemetry, addToast, requestTimeout }) {
      const [selectedModelIds, setSelectedModelIds] = useState([
        'llama-3.1-8b-instant',
        'llama-3.3-70b-versatile'
      ]);
      const [prompt, setPrompt] = useState('Explain speculative decoding in LLMs with a real-world analogy.');
      const [modelResults, setModelResults] = useState({});
      const [isComparing, setIsComparing] = useState(false);
      const [copiedModel, setCopiedModel] = useState(null);
      const abortCtrlRef = useRef(null);

      const presets = [
        'Speculative decoding in LLMs with an analogy',
        'Evaluate microservices vs monolithic architecture',
        'Python generator vs list comprehension memory profiling'
      ];

      const handleToggle = (id) => {
        if (selectedModelIds.includes(id)) {
          if (selectedModelIds.length > 2) setSelectedModelIds(selectedModelIds.filter(m => m !== id));
          else addToast('Select at least 2 models', 'info');
        } else {
          if (selectedModelIds.length < 4) setSelectedModelIds([...selectedModelIds, id]);
          else addToast('Max 4 models for comparison', 'info');
        }
      };

      const handleCompare = async () => {
        const val = validatePrompt(prompt);
        if (!val.valid || isComparing) return;

        setIsComparing(true);
        const ctrl = new AbortController();
        abortCtrlRef.current = ctrl;

        const initial = {};
        selectedModelIds.forEach(id => { initial[id] = { status: 'loading' }; });
        setModelResults(initial);

        const tasks = selectedModelIds.map(async (mId) => {
          const effectiveKey = sessionApiKey.trim();
          if (effectiveKey) {
            const res = await callGroqChatAPI({
              apiKey: effectiveKey,
              model: mId,
              messages: [{ role: 'user', content: val.text }],
              temperature: 0.7,
              maxTokens: 512,
              signal: ctrl.signal,
              timeoutMs: (requestTimeout || 30) * 1000
            });
            recordTelemetry({
              endpoint: '/openai/v1/chat/completions',
              model: mId,
              status: res.status,
              statusText: res.ok ? '200 OK' : `Error ${res.status}`,
              latencyMs: res.latency_ms,
              promptTokens: res.usage?.prompt_tokens || 0,
              completionTokens: res.usage?.completion_tokens || 0,
              totalTokens: res.tokens || 0,
              isLive: res.is_live,
              isSimulated: false,
              error: res.ok ? null : res.error,
              promptPreview: `[Benchmark] ${val.text.substring(0, 80)}`,
              responsePreview: (res.content || res.error || '').substring(0, 100)
            });

            const speed = res.latency_ms > 0 ? Math.round(res.tokens / (res.latency_ms / 1000)) : 0;
            setModelResults(prev => ({
              ...prev,
              [mId]: {
                status: res.ok ? 'success' : 'error',
                content: res.content,
                reasoning: res.reasoning,
                error: res.error,
                latency_ms: res.latency_ms,
                tokens: res.tokens,
                speed_tps: speed,
                is_live: true
              }
            }));
          } else {
            // Demo
            await new Promise(r => setTimeout(r, 200 + Math.random() * 200));
            const sim = simulateSpecializedResponse({ model: mId, prompt: val.text });
            const speed = sim.latency_ms > 0 ? Math.round(sim.tokens / (sim.latency_ms / 1000)) : 0;
            recordTelemetry({
              endpoint: 'demo://compare',
              model: mId,
              status: 200,
              statusText: '200 Demo OK',
              latencyMs: sim.latency_ms,
              promptTokens: 20,
              completionTokens: sim.tokens,
              totalTokens: sim.tokens,
              isLive: false,
              isSimulated: true,
              error: null,
              promptPreview: `[Benchmark Demo] ${val.text.substring(0, 80)}`,
              responsePreview: sim.content.substring(0, 100)
            });
            setModelResults(prev => ({
              ...prev,
              [mId]: {
                status: 'success',
                content: sim.content,
                reasoning: sim.reasoning,
                latency_ms: sim.latency_ms,
                tokens: sim.tokens,
                speed_tps: speed,
                is_live: false
              }
            }));
          }
        });

        await Promise.allSettled(tasks);
        setIsComparing(false);
        abortCtrlRef.current = null;
      };

      return (
        <section className={`bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-6 sm:p-7 shadow-xs space-y-5 animate-fade-in ${fullView ? 'max-w-6xl' : ''}`}>
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 dark:border-slate-800 pb-4">
            <div>
              <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                <Icons.GitCompare className="w-5 h-5 text-purple-500" />
                <span>Multi-Model Benchmark</span>
              </h2>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                Compare up to 4 models concurrently with isolated latency & tokens/sec metrics.
              </p>
            </div>

            <div className="flex flex-wrap gap-1.5">
              {models.slice(0, 6).map(m => {
                const sel = selectedModelIds.includes(m.id);
                return (
                  <button
                    key={m.id}
                    onClick={() => handleToggle(m.id)}
                    className={`px-2.5 py-1 rounded-xl text-xs font-semibold transition-all cursor-pointer ${
                      sel ? 'bg-purple-600 text-white shadow-xs' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:border-slate-600 border border-transparent'
                    }`}
                  >
                    {m.name}
                  </button>
                );
              })}
            </div>
          </div>

          <div className="space-y-2">
            <textarea
              rows={2}
              value={prompt}
              onChange={e => setPrompt(e.target.value)}
              placeholder="Prompt to evaluate across models..."
              className="w-full p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm text-slate-800 dark:text-slate-100 outline-none focus:border-purple-500 resize-none"
            />
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div className="flex flex-wrap gap-1">
                {presets.map((p, i) => (
                  <button key={i} onClick={() => setPrompt(p)} className="text-[11px] px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-purple-400 truncate max-w-xs cursor-pointer">
                    {p}
                  </button>
                ))}
              </div>
              <button
                onClick={handleCompare}
                disabled={isComparing || !prompt.trim()}
                className="px-5 py-2 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs transition-all disabled:opacity-40 cursor-pointer shadow-xs shrink-0 self-end sm:self-auto"
              >
                {isComparing ? 'Benchmarking...' : 'Compare Now'}
              </button>
            </div>
          </div>

          {Object.keys(modelResults).length > 0 && (
            <div className={`grid grid-cols-1 ${selectedModelIds.length === 2 ? 'md:grid-cols-2' : 'md:grid-cols-3'} gap-4 pt-2`}>
              {selectedModelIds.map(mId => {
                const res = modelResults[mId];
                if (!res) return null;
                const mObj = models.find(m => m.id === mId) || { name: mId };

                return (
                  <div key={mId} className="p-4 rounded-2xl bg-slate-50/60 dark:bg-slate-850 border border-slate-200 dark:border-slate-750 flex flex-col justify-between space-y-3">
                    <div>
                      <div className="flex items-center justify-between border-b border-slate-200/50 dark:border-slate-700/50 pb-2.5">
                        <span className="font-bold text-xs text-slate-800 dark:text-slate-100 truncate">{mObj.name}</span>
                        {res.status === 'success' && (
                          <span className="text-[10px] font-mono font-bold text-purple-400">{res.latency_ms}ms • {res.speed_tps} T/s</span>
                        )}
                      </div>
                      <div className="mt-3 text-xs text-slate-700 dark:text-slate-300 leading-relaxed max-h-80 overflow-y-auto">
                        {res.status === 'loading' && <div className="py-6 text-center text-slate-400 text-xs">Inferencing...</div>}
                        {res.status === 'error' && <div className="text-rose-400 text-xs">{res.error}</div>}
                        {res.status === 'success' && <MarkdownRenderer content={res.content} reasoning={res.reasoning} isLive={res.is_live} />}
                      </div>
                    </div>

                    {res.status === 'success' && (
                      <div className="pt-2 border-t border-slate-200/50 dark:border-slate-700/50 flex justify-between items-center text-[10px] text-slate-400">
                        <span>{res.tokens} tokens</span>
                        <button
                          onClick={() => {
                            navigator.clipboard.writeText(res.content);
                            setCopiedModel(mId);
                            addToast('Copied', 'success');
                            setTimeout(() => setCopiedModel(null), 2000);
                          }}
                          className="px-2 py-0.5 rounded bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:text-white cursor-pointer"
                        >
                          {copiedModel === mId ? 'Copied' : 'Copy'}
                        </button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </section>
      );
    }

    // ==========================================
    // EXPLORE MODELS COMPONENT
    // ==========================================

          <div className="flex flex-col sm:flex-row gap-2.5">

                placeholder="Search by name, provider, code, reasoning..."
                value={search}
                onChange={e => setSearch(e.target.value)}

              />
              <button

                onClick={() => {
                  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

                <Icons.Mic className="w-3.5 h-3.5" />

                    category === c ? 'bg-purple-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'

                  {c}

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">

              const isFav = favorites.includes(m.id);

                <div key={m.id} className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex flex-col justify-between space-y-3 shadow-2xs hover:border-purple-500/50 transition-colors">

                      <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-purple-500/10 text-purple-400 uppercase tracking-wider">{m.provider}</span>

                    <h3 className="font-bold text-sm text-slate-800 dark:text-slate-100 mt-1">{m.name}</h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 leading-relaxed">{m.description}</p>

    // ==========================================
    // DEVELOPER TELEMETRY DASHBOARD
    // ==========================================
    function DeveloperDashboardView({ telemetryLogs, clearTelemetry, isLiveApi, sessionApiKey, currentModelId, requestTimeout, models, addToast }) {
      const stats = useMemo(() => {
        const total = telemetryLogs.length;
        if (!total) return { total: 0, live: 0, demo: 0, err: 0, tokens: 0, avgLat: 0 };
        const live = telemetryLogs.filter(l => l.isLive).length;
        const err = telemetryLogs.filter(l => l.error && !l.statusText?.includes('Aborted')).length;
        const tokens = telemetryLogs.reduce((a, b) => a + (b.totalTokens || 0), 0);
        const lats = telemetryLogs.map(l => l.latencyMs).filter(n => typeof n === 'number' && n > 0);
        const avgLat = lats.length ? Math.round(lats.reduce((a, b) => a + b, 0) / lats.length) : 0;
        return { total, live, demo: total - live, err, tokens, avgLat };
      }, [telemetryLogs]);

      const [inspectEntry, setInspectEntry] = useState(null);

      return (
        <div className="space-y-6 animate-fade-in max-w-6xl">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                <Icons.Activity className="w-5 h-5 text-purple-500" />
                <span>Developer Telemetry</span>
              </h1>
              <p className="text-xs text-slate-500 dark:text-slate-400">Live API performance metrics & invocation audit.</p>

            <button
              onClick={() => { clearTelemetry(); addToast('Telemetry cleared', 'info'); }}
              disabled={!telemetryLogs.length}
              className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold hover:text-rose-400 cursor-pointer disabled:opacity-40"
            >
              Clear Logs
            </button>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3.5 text-xs">
            <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <span className="text-slate-400 block text-[10px] uppercase font-bold">API Connection</span>
              <span className="text-sm font-extrabold text-slate-800 dark:text-slate-100 mt-1 block">{isLiveApi ? 'Groq LPU Active' : 'Catalog Demo'}</span>
            </div>
            <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <span className="text-slate-400 block text-[10px] uppercase font-bold">Total Invocations</span>
              <span className="text-sm font-extrabold text-slate-800 dark:text-slate-100 mt-1 block">{stats.total} (Live: {stats.live})</span>
            </div>
            <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <span className="text-slate-400 block text-[10px] uppercase font-bold">Tokens Processed</span>
              <span className="text-sm font-extrabold text-purple-400 font-mono mt-1 block">{stats.tokens.toLocaleString()}</span>
            </div>
            <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <span className="text-slate-400 block text-[10px] uppercase font-bold">Average Latency</span>
              <span className="text-sm font-extrabold text-slate-800 dark:text-slate-100 font-mono mt-1 block">{stats.avgLat} ms</span>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 overflow-x-auto">
            <table className="w-full text-left text-xs">
              <thead>
                <tr className="border-b border-slate-100 dark:border-slate-800 text-[10px] uppercase text-slate-400 font-bold">
                  <th className="py-2 px-3">Time</th>
                  <th className="py-2 px-3">Model</th>
                  <th className="py-2 px-3">Status</th>
                  <th className="py-2 px-3">Latency</th>
                  <th className="py-2 px-3">Tokens</th>
                  <th className="py-2 px-3 text-right">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-mono text-[11px]">
                {telemetryLogs.map(l => (
                  <tr key={l.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/40">
                    <td className="py-2.5 px-3 text-slate-400">{l.timestamp}</td>
                    <td className="py-2.5 px-3 font-sans font-semibold text-slate-800 dark:text-slate-200">{l.model}</td>
                    <td className="py-2.5 px-3">
                      <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${l.error ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400'}`}>
                        {l.statusText}
                      </span>
                    </td>
                    <td className="py-2.5 px-3 text-purple-400 font-bold">{l.latencyMs}ms</td>
                    <td className="py-2.5 px-3">{l.totalTokens}</td>

                      <button onClick={() => setInspectEntry(l)} className="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 hover:bg-purple-600 hover:text-white text-purple-400 text-[10px] font-bold cursor-pointer">
                        Inspect
                      </button>
                    </td>
                  </tr>
                ))}
                {!telemetryLogs.length && (
                  <tr><td colSpan="6" className="text-center py-8 text-slate-400 font-sans">No events logged yet.</td></tr>

              </tbody>
            </table>
          </div>

          {inspectEntry && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={() => setInspectEntry(null)}>

                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <h3 className="font-bold text-sm text-slate-800 dark:text-slate-100">Telemetry Payload</h3>
                  <button onClick={() => setInspectEntry(null)} className="p-1 text-slate-400 hover:text-white"><Icons.X className="w-4 h-4" /></button>
                </div>
                <div className="space-y-2 font-mono text-[11px]">
                  <div><span className="text-slate-400 block font-sans">Model:</span>{inspectEntry.model}</div>
                  <div><span className="text-slate-400 block font-sans">Status & Latency:</span>{inspectEntry.statusText} • {inspectEntry.latencyMs}ms</div>
                  <div><span className="text-slate-400 block font-sans">Prompt:</span><div className="p-2 rounded bg-slate-800 text-slate-300 mt-1">{inspectEntry.promptPreview}</div></div>
                  <div><span className="text-slate-400 block font-sans">Response:</span><div className="p-2 rounded bg-slate-800 text-slate-300 mt-1 max-h-32 overflow-y-auto">{inspectEntry.error || inspectEntry.responsePreview}</div></div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

            value={filter}
            onChange={e => setFilter(e.target.value)}

    // ==========================================
    // SETTINGS VIEW
    // ==========================================
    function SettingsView({
      userName,
      setUserName,
      sessionApiKey,
      setSessionApiKey,
      isLiveApi,
      requestTimeout,
      setRequestTimeout,
      setConversations,
      setFavorites,
      addToast,
      onOpenThemePicker,
      onOpenOnboarding
    }) {
      const [nameInput, setNameInput] = useState(userName);
      const [keyInput, setKeyInput] = useState(sessionApiKey);
      const [showKey, setShowKey] = useState(false);
      const [notice, setNotice] = useState('');
      const [isTesting, setIsTesting] = useState(false);

      const handleSaveKey = (e) => {
        e.preventDefault();
        saveSessionApiKey(keyInput.trim());
        setSessionApiKey(keyInput.trim());
        setNotice('Key saved to browser session.');
        addToast('Key saved to session', 'success');
        setTimeout(() => setNotice(''), 3000);
      };

      const handleTest = async () => {
        if (!keyInput.trim()) return;
        setIsTesting(true);
        setNotice('Verifying key with GroqCloud...');
        const res = await fetchGroqLiveModels({ apiKey: keyInput.trim() });
        setIsTesting(false);
        if (res.ok) {
          setNotice(`Connected! Verified ${res.models?.length || 0} models.`);
          addToast('Key verified successfully', 'success');
        } else {
          setNotice(`Failed: ${res.error}`);
          addToast('Verification failed', 'error');
        }
      };

      return (
        <div className="max-w-2xl space-y-6 animate-fade-in">
          <div>
            <h1 className="text-xl font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
              <Icons.Settings className="w-5 h-5 text-purple-500" />
              <span>Workspace Settings</span>
            </h1>
            <p className="text-xs text-slate-500 dark:text-slate-400">Manage credentials, theme, and client preferences.</p>
          </div>

          {notice && (
            <div className="p-3 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-300 text-xs font-semibold">
              {notice}
            </div>
          )}

          {/* User Name */}
          <div className="p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3 shadow-2xs">
            <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400">Personal Identity</h2>
            <div className="flex gap-2">
              <input
                type="text"
                value={nameInput}
                onChange={e => setNameInput(e.target.value)}
                placeholder="Your Name..."
                className="flex-1 px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm text-slate-800 dark:text-slate-100 outline-none focus:border-purple-500"
              />
              <button
                onClick={() => {
                  const t = nameInput.trim();
                  if (t) { setUserName(t); localStorage.setItem('nova_username', t); addToast('Name updated', 'success'); }

                className="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs cursor-pointer"
              >
                Save
              </button>
            </div>
          </div>

          {/* API Key Session Vault */}
          <div className="p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3 shadow-2xs">
            <div className="flex items-center justify-between">
              <div>
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400">GroqCloud API Key (Session Vault)</h2>
                <p className="text-[11px] text-slate-500 mt-0.5">Stored strictly in browser <code>sessionStorage</code> for this window.</p>
              </div>
              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${isLiveApi ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}`}>
                {isLiveApi ? 'Connected' : 'Catalog Mode'}
              </span>
            </div>

            <form onSubmit={handleSaveKey} className="space-y-2.5">
              <div className="relative">
                <input
                  type={showKey ? 'text' : 'password'}
                  value={keyInput}
                  onChange={e => setKeyInput(e.target.value)}
                  placeholder="gsk_..."
                  className="w-full pl-3.5 pr-10 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm font-mono text-slate-800 dark:text-slate-100 outline-none focus:border-purple-500"
                />
                <button type="button" onClick={() => setShowKey(!showKey)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
                  {showKey ? <Icons.EyeOff className="w-3.5 h-3.5" /> : <Icons.Eye className="w-3.5 h-3.5" />}
                </button>
              </div>
              <div className="flex gap-2">
                <button type="submit" className="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs cursor-pointer">
                  Save Key
                </button>
                <button type="button" onClick={handleTest} disabled={isTesting || !keyInput.trim()} className="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-bold text-xs cursor-pointer disabled:opacity-40">
                  {isTesting ? 'Testing...' : 'Test Connection'}
                </button>
                {keyInput && (
                  <button type="button" onClick={() => { setKeyInput(''); saveSessionApiKey(''); setSessionApiKey(''); addToast('Key removed', 'info'); }} className="px-3 py-2 text-rose-400 text-xs font-semibold cursor-pointer">
                    Clear Key
                  </button>
                )}
              </div>
            </form>
          </div>

          {/* Request Timeout */}
          <div className="p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3 shadow-2xs">
            <div className="flex items-center justify-between">
              <div>
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400">Request Timeout</h2>
                <p className="text-[11px] text-slate-500 mt-0.5">Maximum seconds to wait before cancelling an in-flight model request.</p>
              </div>
              <span className="font-mono text-xs font-bold text-purple-400">{requestTimeout}s</span>
            </div>
            <div className="flex items-center gap-2">
              {[15, 30, 60, 90].map(sec => (
                <button
                  key={sec}
                  type="button"
                  onClick={() => {
                    setRequestTimeout(sec);
                    localStorage.setItem('nova_timeout', sec);
                    addToast(`Timeout set to ${sec}s`, 'info');
                  }}
                  className={`px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer transition-all ${
                    requestTimeout === sec
                      ? 'bg-purple-600 text-white'
                      : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {sec}s
                </button>
              ))}
            </div>
          </div>

          {/* Theme Palette */}
          <div className="p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs shadow-2xs">
            <div>
              <span className="font-bold text-slate-800 dark:text-slate-200 block">Theme & Color Palette</span>
              <span className="text-[11px] text-slate-400">Choose from 5 minimalist dark & light palettes (Violet, Midnight, Emerald, Nord, Mono)</span>
            </div>
            <button onClick={onOpenThemePicker} className="px-3.5 py-1.5 rounded-xl bg-purple-500/10 text-purple-400 font-bold border border-purple-500/20 hover:bg-purple-500/20 cursor-pointer">
              Customize Palette →
            </button>
          </div>

          {/* First-Time Setup Welcome Prompt */}
          <div className="p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs shadow-2xs">
            <div>
              <span className="font-bold text-slate-800 dark:text-slate-200 block">First-Time Setup Dialog</span>
              <span className="text-[11px] text-slate-400">Reopen the initial welcome dialog to view or configure your optional Groq API key</span>
            </div>
            {onOpenOnboarding && (
              <button
                type="button"
                onClick={onOpenOnboarding}
                className="px-3.5 py-1.5 rounded-xl bg-purple-500/10 text-purple-400 font-bold border border-purple-500/20 hover:bg-purple-500/20 cursor-pointer"
              >
                Open Welcome Dialog →
              </button>
            )}
          </div>

          {/* Data Management */}
          <div className="p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3 shadow-2xs">
            <div>
              <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400">Local Data Management</h2>
              <p className="text-[11px] text-slate-500 mt-0.5">Clear locally cached session and dialogue history on this device.</p>
            </div>
            <div className="flex flex-wrap gap-2 pt-1">
              <button
                type="button"
                onClick={() => {
                  if (confirm('Clear all conversation history?')) {
                    setConversations([]);
                    localStorage.removeItem('nova_conversations');
                    localStorage.removeItem('novaplay_conversations');
                    addToast('All conversations cleared', 'info');
                  }
                }}
                className="px-3 py-1.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs font-semibold cursor-pointer border border-rose-500/20"
              >
                Clear Conversation History
              </button>
              <button
                type="button"
                onClick={() => {
                  setFavorites(['llama-3.3-70b-versatile']);
                  localStorage.removeItem('nova_favorites');
                  localStorage.removeItem('novaplay_favorites');
                  addToast('Favorites reset to default', 'info');
                }}
                className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-200 text-xs font-semibold cursor-pointer border border-slate-200 dark:border-slate-700"
              >
                Reset Favorites
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ToastContainer({ toasts }) {

              {t.type === 'success' && <Icons.Check className="w-3.5 h-3.5 text-emerald-400" />}

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [userName, setUserName] = useState(() => localStorage.getItem('nova_username') || localStorage.getItem('novaplay_username') || '');
      const [theme, setTheme] = useState(() => localStorage.getItem('nova_theme_style') || localStorage.getItem('novaplay_theme_style') || 'midnight');
      const [isDark, setIsDark] = useState(() => (localStorage.getItem('nova_is_dark') ?? localStorage.getItem('novaplay_is_dark')) !== 'false');

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('nova_theme_style', theme);
      }, [theme]);

      useEffect(() => {
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        localStorage.setItem('nova_is_dark', isDark);
      }, [isDark]);

      const [activeTab, setActiveTab] = useState('playground');
      const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);
      const [showThemeModal, setShowThemeModal] = useState(false);
      const [showTemplateModal, setShowTemplateModal] = useState(false);
      const [showOnboardingModal, setShowOnboardingModal] = useState(() => {
        try {
          return !localStorage.getItem('nova_onboarded');
        } catch(e) {
          return false;
        }
      });

      const [sessionApiKey, setSessionApiKeyState] = useState(() => getSessionApiKey());
      const [isLiveApi, setIsLiveApi] = useState(false);

      const setSessionApiKey = (key) => {
        setSessionApiKeyState(key);
        saveSessionApiKey(key);
      };

      const [requestTimeout, setRequestTimeout] = useState(() => parseInt(localStorage.getItem('nova_timeout') || localStorage.getItem('novaplay_timeout')) || 30);
      const [models, setModels] = useState(DEFAULT_MODELS);
      const [favorites, setFavorites] = useState(() => {
        try { return JSON.parse(localStorage.getItem('nova_favorites') || localStorage.getItem('novaplay_favorites')) || ['llama-3.1-8b-instant']; } catch(e) { return ['llama-3.1-8b-instant']; }
      });
      const [conversations, setConversations] = useState(() => {
        try { return JSON.parse(localStorage.getItem('nova_conversations') || localStorage.getItem('novaplay_conversations')) || INITIAL_CONVERSATIONS; } catch(e) { return INITIAL_CONVERSATIONS; }
      });

      const [activeConversationId, setActiveConversationId] = useState(null);
      const [playgroundModel, setPlaygroundModel] = useState('llama-3.1-8b-instant');
      const [prefillPrompt, setPrefillPrompt] = useState('');
      const [telemetryLogs, setTelemetryLogs] = useState([]);

      const recordTelemetry = useCallback((entry) => {
        setTelemetryLogs(prev => [{ id: Date.now() + Math.random(), timestamp: new Date().toLocaleTimeString(), ...entry }, ...prev].slice(0, 40));
      }, []);

      const [toasts, setToasts] = useState([]);
      const addToast = useCallback((message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
      }, []);

      // Check key on load
      useEffect(() => {
        if (!sessionApiKey.trim()) { setIsLiveApi(false); return; }
        fetchGroqLiveModels({ apiKey: sessionApiKey.trim(), timeoutMs: 12000 })
          .then(res => {
            if (res.ok) {
              setIsLiveApi(true);
              if (res.models?.length) setModels(prev => [...res.models, ...prev.filter(m => !res.models.some(rm => rm.id === m.id))]);
            } else {
              setIsLiveApi(false);
            }
          })
          .catch(() => setIsLiveApi(false));
      }, [sessionApiKey]);

      // Persist conversations
      useEffect(() => {
        try {
          localStorage.setItem('nova_conversations', JSON.stringify(conversations));
        } catch (e) {}
      }, [conversations]);

      // Persist favorites
      useEffect(() => {
        try {
          localStorage.setItem('nova_favorites', JSON.stringify(favorites));
        } catch (e) {}
      }, [favorites]);

      const toggleFavorite = (mId) => {
        setFavorites(prev => prev.includes(mId) ? prev.filter(id => id !== mId) : [...prev, mId]);
      };

      const handleTryModel = (mId, text = '') => {
        setPlaygroundModel(mId);
        setActiveConversationId(null);
        if (text) setPrefillPrompt(text);
        setActiveTab('playground');
      };

      const handleApplyTemplate = (tmpl) => {
        if (tmpl.recommendedModel) setPlaygroundModel(tmpl.recommendedModel);
        setActiveConversationId(null);
        if (tmpl.prompt) setPrefillPrompt(tmpl.prompt);
        setActiveTab('playground');
        addToast(`Loaded: ${tmpl.title}`, 'success');
      };

      const refreshLiveModels = async () => {
        if (!sessionApiKey.trim()) {
          addToast('Add Groq API key in Settings to sync live models', 'info');
          return;
        }
        addToast('Syncing models with GroqCloud...', 'info');
        const res = await fetchGroqLiveModels({ apiKey: sessionApiKey.trim(), timeoutMs: 15000 });
        if (res.ok && res.models?.length) {
          setModels(prev => [...res.models, ...prev.filter(m => !res.models.some(rm => rm.id === m.id))]);
          addToast(`Synced ${res.models.length} active models`, 'success');
        } else {
          addToast(`Sync failed: ${res.error || 'Check key'}`, 'error');
        }
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row">
          <ToastContainer toasts={toasts} />
          {showThemeModal && (
            <ThemePickerModal
              currentTheme={theme}
              onSelectTheme={setTheme}
              isDark={isDark}
              onToggleDark={() => setIsDark(!isDark)}
              onClose={() => setShowThemeModal(false)}
              addToast={addToast}
            />
          )}
          {showTemplateModal && (
            <TemplateLibraryModal
              onApplyTemplate={handleApplyTemplate}
              onClose={() => setShowTemplateModal(false)}
              models={models}
              addToast={addToast}
            />
          )}
          {showOnboardingModal && (
            <OnboardingApiKeyModal
              initialKey={sessionApiKey}
              onSaveKey={(key) => {
                setSessionApiKey(key);
                try { localStorage.setItem('nova_onboarded', 'true'); } catch(e) {}
                setShowOnboardingModal(false);
                if (key) {
                  addToast('Groq API Key saved to session vault', 'success');
                } else {
                  addToast('Welcome to Nova! Running in Catalog Preview mode', 'info');
                }
              }}
              onSkip={() => {
                try { localStorage.setItem('nova_onboarded', 'true'); } catch(e) {}
                setShowOnboardingModal(false);
                addToast('Welcome to Nova! You can add an API key anytime in Settings', 'info');
              }}
              addToast={addToast}
            />
          )}

          <Sidebar
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            userName={userName}
            mobileOpen={mobileSidebarOpen}
            setMobileOpen={setMobileSidebarOpen}
            isLiveApi={isLiveApi}
            onOpenThemePicker={() => setShowThemeModal(true)}
          />

          <div className="flex-1 lg:pl-60 flex flex-col min-h-screen">
            {/* Minimal Header */}
            <header className="h-14 px-4 sm:px-8 border-b border-slate-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 backdrop-blur-md sticky top-0 z-30 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <button onClick={() => setMobileSidebarOpen(true)} className="lg:hidden p-1.5 text-slate-400">
                  <Icons.Menu className="w-5 h-5" />
                </button>
                <span className="font-bold text-xs sm:text-sm text-slate-800 dark:text-slate-200 uppercase tracking-wider">
                  {activeTab === 'playground' && 'AI Playground'}
                  {activeTab === 'compare' && 'Multi-Model Benchmark'}
                  {activeTab === 'explore' && 'Models Catalog'}
                  {activeTab === 'history' && 'Saved History'}
                  {activeTab === 'developer' && 'Telemetry'}
                  {activeTab === 'settings' && 'Settings'}
                </span>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setShowTemplateModal(true)}
                  className="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 hover:text-purple-400 text-slate-600 dark:text-slate-300 text-xs font-semibold flex items-center gap-1 cursor-pointer"
                >
                  <Icons.LayoutTemplate className="w-3.5 h-3.5" />
                  <span className="hidden sm:inline">Templates</span>
                </button>

                <button
                  onClick={() => setShowThemeModal(true)}
                  className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-400 hover:text-purple-400 cursor-pointer"
                  title="Switch theme"
                >
                  <Icons.Palette className="w-4 h-4" />
                </button>
              </div>
            </header>

            <main className="flex-1 p-4 sm:p-6 max-w-6xl w-full mx-auto">
              {activeTab === 'playground' && (
                <PlaygroundView
                  models={models}
                  currentModelId={playgroundModel}
                  setCurrentModelId={setPlaygroundModel}
                  prefillPrompt={prefillPrompt}
                  clearPrefillPrompt={() => setPrefillPrompt('')}
                  sessionApiKey={sessionApiKey}
                  setSessionApiKey={setSessionApiKey}
                  isLiveApi={isLiveApi}
                  conversations={conversations}
                  setConversations={setConversations}
                  activeConversationId={activeConversationId}
                  setActiveConversationId={setActiveConversationId}
                  onOpenSettings={() => setActiveTab('settings')}
                  recordTelemetry={recordTelemetry}
                  addToast={addToast}
                  requestTimeout={requestTimeout}
                  userName={userName}
                  onOpenTemplates={() => setShowTemplateModal(true)}
                />
              )}

              {activeTab === 'compare' && (
                <CompareSection
                  models={models}
                  sessionApiKey={sessionApiKey}
                  fullView={true}
                  recordTelemetry={recordTelemetry}
                  addToast={addToast}
                  requestTimeout={requestTimeout}
                />
              )}

              {activeTab === 'explore' && (
                <ExploreModelsFullView
                  models={models}
                  favorites={favorites}
                  onToggleFavorite={toggleFavorite}
                  onTryModel={handleTryModel}
                  isLiveApi={isLiveApi}
                  onOpenSettings={() => setActiveTab('settings')}
                  onRefreshModels={refreshLiveModels}
                />
              )}

              {activeTab === 'history' && (
                <HistoryView
                  conversations={conversations}
                  onOpenConversation={cId => { setActiveConversationId(cId); setActiveTab('playground'); }}
                  onDeleteConversation={cId => setConversations(prev => prev.filter(c => c.id !== cId))}
                  onStartNewChat={() => { setActiveConversationId(null); setActiveTab('playground'); }}
                  addToast={addToast}
                />
              )}

              {activeTab === 'developer' && (
                <DeveloperDashboardView
                  telemetryLogs={telemetryLogs}
                  clearTelemetry={() => setTelemetryLogs([])}
                  isLiveApi={isLiveApi}
                  sessionApiKey={sessionApiKey}
                  currentModelId={playgroundModel}
                  requestTimeout={requestTimeout}
                  models={models}
                  addToast={addToast}
                />
              )}

              {activeTab === 'settings' && (
                <SettingsView
                  userName={userName}
                  setUserName={setUserName}
                  sessionApiKey={sessionApiKey}
                  setSessionApiKey={setSessionApiKey}
                  isLiveApi={isLiveApi}
                  requestTimeout={requestTimeout}
                  setRequestTimeout={setRequestTimeout}
                  setConversations={setConversations}
                  setFavorites={setFavorites}
                  addToast={addToast}
                  onOpenThemePicker={() => setShowThemeModal(true)}
                  onOpenOnboarding={() => setShowOnboardingModal(true)}
                />
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
